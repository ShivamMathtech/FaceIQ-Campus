services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: faceiq
      POSTGRES_USER: faceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceiq"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://faceiq:${POSTGRES_PASSWORD}@db:5432/faceiq
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage/models:/app/storage/models:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
